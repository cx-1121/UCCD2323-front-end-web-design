<text x="36" y="302" font-size="11" fill="#4a564e" font-family="Arial, Helvetica, sans-serif">Five-country fossil-share bars (China/USA/India/Germany/Brazil) + "OPEN THE LIVE DASHBOARD" CTA.</text>
