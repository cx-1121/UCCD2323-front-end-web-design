<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Landing -->
  <rect x="380" y="20" width="200" height="60" rx="10" fill="#eef4f0" stroke="#2f6f52" stroke-width="2"/>
  <text x="480" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a24">Landing ( / )</text>
  <text x="480" y="63" text-anchor="middle" font-size="11" fill="#4a564e">Cinematic intro, "Yes, I'm in"</text>

  <line x1="480" y1="80" x2="480" y2="120" stroke="#2f6f52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Home -->
  <rect x="380" y="120" width="200" height="60" rx="10" fill="#eef4f0" stroke="#2f6f52" stroke-width="2"/>
  <text x="480" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2a24">Home ( /home )</text>
  <text x="480" y="163" text-anchor="middle" font-size="11" fill="#4a564e">Gateway / hub</text>

  <!-- Persistent header nav band -->
  <rect x="40" y="230" width="880" height="120" rx="10" fill="none" stroke="#94a89c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="60" y="222" font-size="11" fill="#4a564e">Persistent header navigation (visible on every page below)</text>

  <!-- five nav nodes -->
  <g>
    <rect x="60"  y="260" width="150" height="55" rx="8" fill="#eef4f0" stroke="#2f6f52" stroke-width="2"/>
    <text x="135" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2a24">Home</text>
    <text x="135" y="301" text-anchor="middle" font-size="10" fill="#4a564e">/home</text>

    <rect x="235" y="260" width="150" height="55" rx="8" fill="#eef4f0" stroke="#2f6f52" stroke-width="2"/>
    <text x="310" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2a24">Explore</text>
    <text x="310" y="301" text-anchor="middle" font-size="10" fill="#4a564e">/explore</text>

    <rect x="410" y="260" width="150" height="55" rx="8" fill="#eef4f0" stroke="#2f6f52" stroke-width="2"/>
    <text x="485" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2a24">Projects</text>
    <text x="485" y="301" text-anchor="middle" font-size="10" fill="#4a564e">/projects</text>

    <rect x="585" y="260" width="150" height="55" rx="8" fill="#eef4f0" stroke="#2f6f52" stroke-width="2"/>
    <text x="660" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2a24">Dashboard</text>
    <text x="660" y="301" text-anchor="middle" font-size="10" fill="#4a564e">/dashboard</text>

    <rect x="760" y="260" width="150" height="55" rx="8" fill="#eef4f0" stroke="#2f6f52" stroke-width="2"/>
    <text x="835" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2a24">About</text>
    <text x="835" y="301" text-anchor="middle" font-size="10" fill="#4a564e">/about</text>
  </g>

  <line x1="480" y1="180" x2="480" y2="230" stroke="#2f6f52" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Quiz Challenge (contextual CTA) -->
  <rect x="150" y="440" width="190" height="60" rx="10" fill="#f4f0ee" stroke="#8a6b2f" stroke-width="2"/>
  <text x="245" y="465" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2a24">Quiz Challenge</text>
  <text x="245" y="483" text-anchor="middle" font-size="10" fill="#4a564e">/quiz-challenge</text>

  <!-- Contact (contextual CTA) -->
  <rect x="640" y="440" width="190" height="60" rx="10" fill="#f4f0ee" stroke="#8a6b2f" stroke-width="2"/>
  <text x="735" y="465" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2a24">Contact</text>
  <text x="735" y="483" text-anchor="middle" font-size="10" fill="#4a564e">/contact</text>

  <!-- dashed CTA links -->
  <path d="M135,315 C135,390 245,390 245,440" fill="none" stroke="#8a6b2f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <path d="M310,315 C310,390 245,390 245,440" fill="none" stroke="#8a6b2f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <path d="M485,315 C485,390 245,400 245,440" fill="none" stroke="#8a6b2f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <path d="M835,315 C835,390 735,390 735,440" fill="none" stroke="#8a6b2f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>

  <text x="480" y="530" text-anchor="middle" font-size="11" fill="#4a564e">Solid = primary navigation flow.  Dashed = contextual call-to-action link (in-page button/card, not in the header).</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f6f52"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a6b2f"/>
    </marker>
  </defs>
</svg>
