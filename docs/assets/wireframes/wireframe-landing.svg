<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 652">
<rect x="0" y="0" width="800" height="652" fill="#ffffff"/>

<rect x="24" y="94" width="752" height="44" rx="8" fill="#eef0ee" stroke="#9aa79c" stroke-width="1.5"/>
<text x="36" y="114" font-size="13" font-weight="bold" fill="#1f2a24" font-family="Arial, Helvetica, sans-serif">Scroll cue</text>
<text x="36" y="132" font-size="11" fill="#4a564e" font-family="Arial, Helvetica, sans-serif">"SCROLL DOWN" — sets the interaction model before any content appears.</text>
<rect x="24" y="152" width="752" height="90" rx="8" fill="#eef0ee" stroke="#9aa79c" stroke-width="1.5"/>
<text x="36" y="172" font-size="13" font-weight="bold" fill="#1f2a24" font-family="Arial, Helvetica, sans-serif">Slide 1 — Carbon</text>
<text x="36" y="190" font-size="11" fill="#4a564e" font-family="Arial, Helvetica, sans-serif">"Our world runs on energy." / "CARBON" / "Fossil fuels power our lives, but drain our planet."</text>
<text x="36" y="204" font-size="11" fill="#4a564e" font-family="Arial, Helvetica, sans-serif">Full-bleed scene, GSAP scroll-driven.</text>
<rect x="24" y="256" width="752" height="80" rx="8" fill="#eef0ee" stroke="#9aa79c" stroke-width="1.5"/>
<text x="36" y="276" font-size="13" font-weight="bold" fill="#1f2a24" font-family="Arial, Helvetica, sans-serif">Slide 2 — Turn</text>
<text x="36" y="294" font-size="11" fill="#4a564e" font-family="Arial, Helvetica, sans-serif">"But at what cost?" / "Yet, this is not where our story ends." / "There is another way forward."</text>
<rect x="24" y="350" width="752" height="80" rx="8" fill="#eef0ee" stroke="#9aa79c" stroke-width="1.5"/>
<text x="36" y="370" font-size="13" font-weight="bold" fill="#1f2a24" font-family="Arial, Helvetica, sans-serif">Slide 3 — Invitation</text>
<text x="36" y="388" font-size="11" fill="#4a564e" font-family="Arial, Helvetica, sans-serif">"A future powered by possibility." / "Can you help us to save the world?" / "Welcome to Green</text>
<text x="36" y="402" font-size="11" fill="#4a564e" font-family="Arial, Helvetica, sans-serif">Tech Club."</text>
<rect x="24" y="444" width="752" height="56" rx="8" fill="#e7efe9" stroke="#2f6f52" stroke-width="1.5"/>
<text x="36" y="464" font-size="13" font-weight="bold" fill="#1f2a24" font-family="Arial, Helvetica, sans-serif">Entry CTA</text>
<text x="36" y="482" font-size="11" fill="#4a564e" font-family="Arial, Helvetica, sans-serif">Button: "YES, I'M IN" — commits hasChosenFuture to localStorage and routes to /home.</text>
<rect x="24" y="514" width="752" height="60" rx="8" fill="#f5f3ee" stroke="#8a6b2f" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="36" y="534" font-size="13" font-weight="bold" fill="#1f2a24" font-family="Arial, Helvetica, sans-serif">Cookie consent overlay</text>
<text x="36" y="552" font-size="11" fill="#4a564e" font-family="Arial, Helvetica, sans-serif">Bottom sheet: "We store one cookie... and use local storage...". Buttons: Decline / Accept.</text>
<line x1="0" y1="612" x2="800" y2="612" stroke="#d9ded9" stroke-width="1"/>
<text x="400" y="636" text-anchor="middle" font-size="10" fill="#8a958e" font-family="Arial, Helvetica, sans-serif">Green Tech Club &#183; Built for a grid that outlives us</text>
</svg>