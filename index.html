    <!-- THREE FACES, THREE JOBS. One request, and every family in it is set by
         something the visitor can actually see.

           Archivo Narrow  the gothic a rubber stamp is cut in. Headings and
                           controls, short strings only.
           Courier Prime   what a determination label is actually typed on.
                           Every instrument reading on the site.
           Outfit          the one face allowed to run prose, and the
                           cinematic's shouted 800.

         Two families were dropped from this tag. Plus Jakarta Sans (five
         weights) and JetBrains Mono (three) were downloaded by every visitor
         and set by no route — they survived only in a handful of shared
         components that had never been moved onto the three roles above.
         Montserrat went earlier: it was a fallback in a stack, never loaded at
         all, so it could not have been selected even where it was named. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Archivo+Narrow:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — revisit surface (/?replay=true)

      THESIS: A returning visitor is an accession, not a cache-miss. Refuses the
      dark blurred modal with a centred message this category always ships.
      OWN-WORLD: Seed-vault interior at -18C. Cold near-black ground worked in
      tonal depth; the specimen sheet reads pale steel-green, never parchment;
      violet aniline stamps; ONE living green reserved for what is alive;
      pressed-city line work in grey-brown. Courier Prime typed, Archivo Narrow
      stamped.
      STORY: They came back. The sheet records it. The third return determines
      the specimen and opens the vault catalogue.
      FIRST VIEWPORT: Sheet upright in vault dark, filling most of the frame;
      the pressed industrial city mounted under linen strips; annotation slips
      stacked up the right edge, newest on top; typed determination label
      bottom-right; a violet stamp presses across it.
      FORM: Herbarium specimen sheet & seed vault; candidate 6 of 7; seed f7aee1de.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
    <!--
      DIRECTION CONTRACT — the interior (/home and every route behind it)

      THESIS: The site is one institution — a herbarium of energy — and the
      story is told as a physical event inside it: the vault warms and opens.
      Refuses the eight-independent-pages club site, and refuses a dark theme
      that flips to a light one at a route boundary.
      OWN-WORLD: The revisit surface's grammar, generalised. Square paper
      objects with cut edges and long cast shadows; typed instrument readings
      in Courier Prime; rubber-stamped headings in Archivo Narrow; flush
      filing runs instead of card grids; worked ground texture, never a
      gradient wash. Colour comes from an eight-stop ladder — stacks, soot,
      haze, thaw, firstlight, daylight, sky, living — and a section moves
      along the arc by naming its stop. One living green, spent once per
      surface on what is actually alive.
      STORY: The reader arrives in morning light, is taken back down into the
      airshed and the soot to see what still runs the world, is brought up
      through sunrise into daylight, and is asked to join.
      FIRST VIEWPORT (/home): full-bleed forest photograph, stamped display
      lettering bottom-left, two island controls under it, the photograph
      dissolving into the airshed of the chapter beneath.
      FORM: Herbarium specimen sheet & seed vault, inherited from the revisit
      surface; seed f7aee1de. Extension of an established world, not a roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
